<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roteador de tópico · Topic router</title>
<script type="importmap">
{ "imports": {
  "onnxruntime-web/webgpu": "../vendor/ort/ort.webgpu.min.mjs",
  "onnxruntime-web": "../vendor/ort/ort.webgpu.min.mjs",
  "onnxruntime-common": "../vendor/ortc/index.js",
  "@huggingface/transformers": "../vendor/tjs/transformers.web.js"
} }
</script>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #fff; --ok: #166534; --okbg: #dcfce7;
          --no: #9a3412; --nobg: #ffedd5; --warnbg: #fef3c7; --warn: #78350f; --accent: #1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --card: #292524;
          --ok: #86efac; --okbg: #14532d; --no: #fdba74; --nobg: #431407; --warnbg: #451a03; --warn: #fde68a; --accent: #93c5fd; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { font-weight: 600; font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  textarea { width: 100%; min-height: 150px; resize: vertical; font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
             padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .grow { flex: 1; }
  button.primary { padding: 9px 18px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font-weight: 650; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.ghost { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; font-size: 13px; }
  button.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
  input[type=range] { width: 160px; }
  #status { color: var(--muted); font-size: 13px; margin-top: 10px; min-height: 1.5em; overflow-wrap: anywhere; }
  .summary { display: flex; gap: 24px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
  .big { font-size: 34px; font-weight: 750; letter-spacing: -0.02em; }
  .item { border-top: 1px solid var(--line); padding: 12px 0; }
  .item:first-of-type { border-top: 0; }
  .msg { overflow-wrap: anywhere; }
  .meta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 650; white-space: nowrap; }
  .yes { background: var(--okbg); color: var(--ok); } .no { background: var(--nobg); color: var(--no); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; width: 110px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .cands { margin-top: 8px; display: grid; grid-template-columns: minmax(0, 150px) 1fr 48px; gap: 4px 10px; align-items: center; font-size: 13px; }
  .cands .bar { width: 100%; display: block; margin: 0; }
  pre { margin: 8px 0 0; padding: 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .cmp > div { border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
  .cmp b { font-size: 24px; letter-spacing: -0.01em; }
  footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
  @media (max-width: 640px) { .big { font-size: 28px; } .cmp { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1 data-i="title"></h1>
      <p class="sub" data-i="sub"></p>
    </div>
    <button class="ghost" id="lang" aria-label="language">EN</button>
  </div>

  <section class="card">
    <label for="text" data-i="input"></label>
    <textarea id="text" spellcheck="false"></textarea>
    <div class="row">
      <label class="grow" style="margin:0"><span data-i="abstain"></span> <b id="thv">0.20</b>
        <input type="range" id="th" min="0" max="0.9" step="0.05" value="0.2"></label>
      <button class="primary" id="run" disabled data-i="loading"></button>
    </div>
    <div id="status"></div>
  </section>

  <section class="card" id="results" hidden></section>
  <section class="card" id="cmpcard" hidden></section>
  <footer data-i="foot"></footer>
</main>
<script type="module">
import * as ort from "onnxruntime-web/webgpu";
import * as tjs from "@huggingface/transformers";
import { S1S2 } from "../lib/index.js";

const REPO = "eduardoworrel/S5-nano-ContractNLI-CLINC-SIB-ONNX-genai-int4-S1S2";
const REV = "ac7e5cfa31b46e29c06842945fe69163b81fca5f"; // published revision; manifest.sib_en.json declares the 7-topic choice head
const params = new URLSearchParams(location.search);
const MANIFEST = params.get("manifest") ?? `https://huggingface.co/${REPO}/resolve/${REV}/manifest.sib_en.json`;
const EXAMPLES = [
  "The striker scored twice in the second half and the home side won the match.",
  "The prime minister said the budget bill will go to a vote in parliament next week.",
  "Researchers announced a battery that charges in five minutes using a new electrode material.",
  "Doctors recommend regular exercise and a balanced diet to lower blood pressure.",
  "The hotel is a ten minute walk from the train station and has a rooftop terrace.",
  "The film opens this weekend with a cast of well known actors.",
  "The river runs through a deep valley before reaching the sea on the northern coast.",
  "Please reset my password.",
].join("\n");

const I18N = {
  pt: { title: "Roteador de tópico", sub: "Uma passada, sem gerar texto: o modelo escolhe entre 7 tópicos e diz a margem.",
    input: "Uma frase em inglês por linha", abstain: "Abster abaixo da margem", loading: "Carregando modelo…", ready: "Rotear",
    nowebgpu: "Precisa de WebGPU (Chrome ou Edge recentes).", ready_s: "Modelo pronto. Tudo roda neste aparelho.",
    err_load: "Não foi possível carregar o modelo: ", empty: "Escreva ao menos uma frase.",
    routed: "frases roteadas", abst: "abstidas", total: "total", per: "por decisão", margin: "margem", abstains: "abstém",
    cands: "candidatos", see: "ver o que o modelo escolheu", hide: "esconder", seen_q: "Pergunta", seen_opts: "Opções", seen_pick: "Escolha",
    seen_how: "Leitura", seen_how_v: "cabeça treinada (uma passada, sem gerar)", rawm: "margem bruta",
    cmp_t: "Custo: decidir × gerar JSON", cmp_b: "Comparar na 1ª frase", cmp_run: "Medindo…",
    cmp_dec: "Decidir (uma passada)", cmp_gen: "Gerar JSON", cmp_med: "mediana de 3, este aparelho", cmp_out: "saída", cmp_valid: "JSON válido", cmp_same: "mesmo tópico", yes: "sim", no: "não",
    foot: "Modelo: S5-nano ContractNLI + CLINC150 + SIB-200 (int4, 2,4 GB, baixa uma vez). Tópicos do SIB-200 em inglês; a cabeça do SIB não tem registro de fidelidade no navegador. O limiar é só do demo, não foi calibrado." },
  en: { title: "Topic router", sub: "One pass, no generation: the model picks among 7 topics and reports the margin.",
    input: "One English sentence per line", abstain: "Abstain below margin", loading: "Loading model…", ready: "Route",
    nowebgpu: "Needs WebGPU (recent Chrome or Edge).", ready_s: "Model ready. Everything runs on this device.",
    err_load: "Could not load the model: ", empty: "Write at least one sentence.",
    routed: "sentences routed", abst: "abstained", total: "total", per: "per decision", margin: "margin", abstains: "abstains",
    cands: "candidates", see: "see what the model chose", hide: "hide", seen_q: "Question", seen_opts: "Options", seen_pick: "Choice",
    seen_how: "Reading", seen_how_v: "trained head (one pass, no generation)", rawm: "raw margin",
    cmp_t: "Cost: decide vs generate JSON", cmp_b: "Compare on the 1st sentence", cmp_run: "Measuring…",
    cmp_dec: "Decide (one pass)", cmp_gen: "Generate JSON", cmp_med: "median of 3, this device", cmp_out: "output", cmp_valid: "valid JSON", cmp_same: "same topic", yes: "yes", no: "no",
    foot: "Model: S5-nano ContractNLI + CLINC150 + SIB-200 (int4, 2.4 GB, downloaded once). SIB-200 topics in English; the SIB head has no browser fidelity record. The threshold is the demo's own, not calibrated." },
};
let L = params.get("lang") ?? (navigator.language?.toLowerCase().startsWith("pt") ? "pt" : "en");
const t = (k) => I18N[L][k];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const setStatus = (m) => { $("status").textContent = m; };
function applyLang() {
  document.documentElement.lang = L === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-i]").forEach((n) => { if (!(n.id === "run" && lib)) n.textContent = t(n.dataset.i); });
  $("lang").textContent = L === "pt" ? "EN" : "PT";
  if (lib) $("run").textContent = t("ready");
  if (last) render(last);
}

let lib = null, manifest = null, last = null, loadMs = 0;
const dec = (text) => lib.decide({ input: manifest.lab.state.replace("{frase}", text),
  questions: [{ name: "topic", type: "choice", choices: manifest.lab.options, instructions: manifest.lab.question }] }, { keepState: false });

async function loadModel() {
  manifest = await (await fetch(MANIFEST)).json();
  let mirrors = {};
  try { mirrors = await (await fetch("../models.json")).json(); } catch {}
  const baseUrls = {};
  for (const repo of [manifest.tokenizer.repo, ...Object.values(manifest.builds).map((b) => b.repo)])
    if (mirrors[repo]) baseUrls[repo] = new URL(mirrors[repo], location.href).href;
  ort.env.wasm.numThreads = 1;
  ort.env.wasm.wasmPaths = new URL("../vendor/ort/", location.href).href;
  const t0 = performance.now();
  lib = await S1S2.load({ manifest, build: "genai-int4-webgpu", modules: { ort, transformers: tjs }, baseUrls, allowUnverified: Object.keys(baseUrls).length > 0, // a local mirror: its big weights are not Hub-verified
    genai: { verifyEp: true }, onStatus: (m) => setStatus(m) });
  await (await dec("Warm up.")).dispose(); // compile the kernels once, so the ms below are steady
  loadMs = performance.now() - t0;
}

async function run() {
  const lines = $("text").value.split("\n").map((s) => s.trim()).filter(Boolean);
  if (!lines.length) { setStatus(t("empty")); return; }
  $("run").disabled = true; $("cmpcard").hidden = true;
  const rows = [];
  try {
    const t0 = performance.now();
    for (const [i, text] of lines.entries()) {
      setStatus(`${i + 1} / ${lines.length}`);
      const a0 = performance.now();
      const s = await dec(text);
      const ms = performance.now() - a0;
      const a = s.answers[0];
      rows.push({ text, ms, a: { choice: a.choice, margin: a.margin, rawMargin: a.rawMargin, method: a.method, confidence: a.confidence,
        cands: [...a.probabilities].sort((x, y) => y.probability - x.probability) } });
      await s.dispose();
      last = { rows, total: performance.now() - t0, done: i + 1 === lines.length };
      render(last);
    }
    setStatus("");
    showCompare(lines[0]);
  } catch (e) { setStatus(`Error: ${e?.message ?? e}`); console.error(e); }
  finally { $("run").disabled = false; }
}

const abstains = (r) => r.a.margin < Number($("th").value);

function render(st) {
  const el = $("results");
  el.hidden = false;
  const ab = st.rows.filter(abstains).length;
  const mean = st.rows.reduce((x, r) => x + r.ms, 0) / st.rows.length;
  el.innerHTML = `<div class="summary"><div><span class="big">${st.rows.length - ab}</span><span class="big" style="color:var(--muted)"> / ${st.rows.length}</span> ${t("routed")}</div>
    <div>${ab} ${t("abst")}<br><small style="color:var(--muted)">${(st.total / 1000).toFixed(1)} s ${t("total")} · ${Math.round(mean)} ms ${t("per")}</small></div></div>` +
    st.rows.map((r, i) => `<div class="item"><div class="msg">${esc(r.text)}</div>
      <div class="meta"><span class="pill ${abstains(r) ? "no" : "yes"}">${abstains(r) ? t("abstains") : esc(r.a.choice)}</span>
        <span><span class="bar"><i style="width:${Math.round(100 * r.a.margin)}%"></i></span>${t("margin")} ${r.a.margin.toFixed(2)}</span>
        <span>${Math.round(r.ms)} ms</span>
        <button class="link" data-see="${i}">${t("see")}</button></div>
      <div class="cands">${r.a.cands.slice(0, 3).map((c) => `<span>${esc(c.value)}</span><span class="bar"><i style="width:${Math.round(100 * c.probability)}%"></i></span><span>${c.probability.toFixed(2)}</span>`).join("")}</div>
      <div id="see${i}"></div></div>`).join("");
  el.querySelectorAll("[data-see]").forEach((b) => b.addEventListener("click", () => {
    const i = Number(b.dataset.see), box = $("see" + i), r = st.rows[i];
    if (box.innerHTML) { box.innerHTML = ""; b.textContent = t("see"); return; }
    b.textContent = t("hide");
    const letters = "ABCDEFGHIJ";
    const idx = manifest.lab.options.indexOf(r.a.choice);
    box.innerHTML = `<pre>${esc(`${t("seen_q")}: ${manifest.lab.question}\n${manifest.lab.state.replace("{frase}", r.text)}\n${t("seen_opts")}:\n` +
      manifest.lab.options.map((o, k) => `  ${letters[k]}) ${o}`).join("\n") +
      `\n\n${t("seen_pick")}: ${letters[idx]}) ${r.a.choice}\n${t("seen_how")}: ${t("seen_how_v")}\n` +
      r.a.cands.map((c) => `  ${c.value.padEnd(20)} ${c.probability.toFixed(4)}`).join("\n") +
      `\n${t("margin")} ${r.a.margin.toFixed(4)} · ${t("rawm")} ${r.a.rawMargin?.toFixed(3)} · ${r.a.method}`)}</pre>`;
  }));
}

const median = (xs) => [...xs].sort((a, b) => a - b)[xs.length >> 1];
async function showCompare(text) {
  const el = $("cmpcard");
  el.hidden = false;
  el.innerHTML = `<b>${t("cmp_t")}</b><div class="row"><button class="ghost" id="cmpgo">${t("cmp_b")}</button></div><div id="cmpout"></div>`;
  $("cmpgo").addEventListener("click", async () => {
    $("cmpgo").disabled = true; $("cmpgo").textContent = t("cmp_run");
    try {
      const opts = manifest.lab.options;
      const decMs = [], genMs = [];
      let pick = null, out = "";
      for (let k = 0; k < 3; k++) { const t0 = performance.now(); const s = await dec(text); decMs.push(performance.now() - t0); pick = s.answers[0].choice; await s.dispose(); }
      const prompt = `Sentence: ${text}\nWhat is the topic of this sentence? Reply only with JSON like {"topic": "<option>"}, where <option> is one of: ${opts.join(", ")}.`;
      for (let k = 0; k < 3; k++) { const t0 = performance.now(); out = (await lib.generate(prompt, { maxNewTokens: 24, temperature: 0 })).text.trim(); genMs.push(performance.now() - t0); }
      let valid = false, same = false;
      try { const j = JSON.parse(out.replace(/^```(?:json)?|```$/g, "").trim()); valid = typeof j === "object"; same = j.topic === pick; } catch {}
      $("cmpout").innerHTML = `<div class="cmp"><div><div>${t("cmp_dec")}</div><b>${Math.round(median(decMs))} ms</b><div class="meta">${esc(pick)}</div></div>
        <div><div>${t("cmp_gen")}</div><b>${Math.round(median(genMs))} ms</b><div class="meta">${t("cmp_out")}: ${esc(out)}<br>${t("cmp_valid")}: ${valid ? t("yes") : t("no")} · ${t("cmp_same")}: ${same ? t("yes") : t("no")}</div></div></div>
        <div class="meta">${t("cmp_med")} · ×${(median(genMs) / median(decMs)).toFixed(1)}</div>`;
    } catch (e) { $("cmpout").textContent = `Error: ${e?.message ?? e}`; console.error(e); }
    $("cmpgo").disabled = false; $("cmpgo").textContent = t("cmp_b");
  });
}

async function main() {
  $("text").value = EXAMPLES;
  $("th").addEventListener("input", () => { $("thv").textContent = Number($("th").value).toFixed(2); if (last) render(last); });
  $("lang").addEventListener("click", () => { L = L === "pt" ? "en" : "pt"; applyLang(); });
  $("run").addEventListener("click", run);
  applyLang();
  if (!navigator.gpu) { setStatus(t("nowebgpu")); $("run").textContent = t("nowebgpu"); return; }
  try {
    await loadModel();
    $("run").textContent = t("ready"); $("run").disabled = false;
    setStatus(`${t("ready_s")} (${(loadMs / 1000).toFixed(1)} s)`);
    window.__demoReady = { loadMs };
  } catch (e) { setStatus(t("err_load") + (e?.message ?? e)); console.error(e); window.__demoError = String(e?.message ?? e); }
}
main();
</script>
</body>
</html>
