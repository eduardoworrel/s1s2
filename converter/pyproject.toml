[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s1s2-convert"
version = "0.1.1"
description = "Convert a Hugging Face causal LM + labelled JSONL into an S1S2 package (LoRA + pointer heads, int4 ONNX Runtime GenAI build) that s1s2 loads"
license = "MIT"
requires-python = ">=3.10"
# Versions the end-to-end proof ran with (converter/README.md); the builder patch targets onnxruntime-genai 0.19.0 exactly.
dependencies = [
  "torch==2.15.0",
  "transformers==5.19.0",
  "peft==0.21.3",
  "safetensors==0.8.0",
  "huggingface_hub",
  "numpy",
  "onnxruntime-genai==0.19.0",
  "onnxruntime==1.31.1",
  "onnx==1.23.2",
  "onnx_ir==1.1.0",
]

[project.scripts]
s1s2-convert = "s1s2_convert.cli:main"

[tool.setuptools]
packages = ["s1s2_convert", "s1s2_convert.tools"]

[tool.setuptools.package-data]
s1s2_convert = ["node/*.mjs", "node/*.js", "patches/*.patch", "data/*.json"]
