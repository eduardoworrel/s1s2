[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s1s2-heads"
version = "0.2.0"
description = "Convert published decision heads (Kev head.pt, GGUF kev, alias3-web, pplx/d3 readout, JEV, transformers DecisionConfig, Clef joint head, Standard One readout) into the S1S2 package, with a fidelity record against each format's reference code"
license = "MIT"
requires-python = ">=3.10"
# The references are pinned: transformers@31d7392 (decision/, models/jev/), gguf-py@llama.cpp 9fba51d, sglang@da614ba (vendored)
dependencies = [
  "torch==2.15.0",
  "safetensors==0.8.0",
  "numpy",
  "huggingface_hub",
  "msgspec",
  "requests",
  "transformers @ git+https://github.com/huggingface/transformers@31d7392997c13162c58f2e3c6555b5e060d6f60b",
  "gguf @ git+https://github.com/ggml-org/llama.cpp@9fba51d2c9a1b5cb5f0c47986c031334e2d7663a#subdirectory=gguf-py",
]

[project.scripts]
s1s2-heads = "s1s2_heads.cli:main"

[tool.setuptools]
packages = ["s1s2_heads", "s1s2_heads.refs"]

[tool.setuptools.package-data]
s1s2_heads = ["node/*.mjs"]
"s1s2_heads.refs" = ["vendor/*"]
